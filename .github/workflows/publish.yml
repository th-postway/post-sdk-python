name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
      - run: uv sync --locked
      - name: Tag must match __version__
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(uv run python -c "import postway; print(postway.__version__)")
          if [ "v$VERSION" != "$TAG" ]; then echo "tag $TAG does not match package version $VERSION"; exit 1; fi
      - run: make check
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
