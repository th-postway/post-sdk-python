name: Publish

# Runs when `git flow release finish` / `git flow hotfix finish` pushes a bare SemVer tag (1.x.y) on main.
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag must be on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then echo "tag $TAG is not on main; release through git flow"; exit 1; fi
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.11'
      - run: uv sync --locked
      - name: Tag must match __version__
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(uv run python -c "import postway; print(postway.__version__)")
          if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || [ "$VERSION" != "$TAG" ]; then echo "tag $TAG does not match package version $VERSION"; exit 1; fi
      - run: make check
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
